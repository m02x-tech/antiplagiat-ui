<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Ситуационный центр</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <main class="login-card">
    <h1 class="login-title">Ситуационный центр</h1>
    <p class="hint">Портфель программ: Центр НТИ, НЦМУ, ПИШ</p>
    {% if error %}<p class="error login-error">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="login-form">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Имя пользователя
        <input type="text" name="username" autocomplete="username" autofocus required>
      </label>
      <label>Пароль
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="login-submit">Войти</button>
    </form>
  </main>
</body>
</html>
